<!-- Pokedex Replicator -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width = device-width, initial-scale = 1.0">
        <link rel="stylesheet" href="styles/style.css">
        <link rel="stylesheet" href="styles/type.css">
        <link rel="stylesheet" href="styles/modal.css">
        <link rel="stylesheet" href="styles/filter.css">

        <!-- Fonts: Press Start 2P, Nunito -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link 
            href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
            rel="stylesheet">

        <link 
            href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Press+Start+2P&display=swap" 
            rel="stylesheet">

        <title>Pokedex Replicator</title>
    </head>

    <body>
        <!-- Title of Page -->
        <h1>KANTO POKEDEX</h1>

        <!-- Filtering -->
        <input
            type="text"
            id="search-input"
            placeholder="Search Pokémon..."
        >

        <!-- Pokemon types -->
        <div id="types"></div>
        
        <!-- Each Pokemon Container -->
        <div id="pokemon-container"></div>

        <!-- Pokemon Modal -->
        <div id="pokemon-modal" class="modal">
            <div class="modal-content">
                <button id="close-modal">&times;</button>

                <div id="modal-info">
                    <!-- Pokemon info here -->
                </div>
            </div>
        </div>


        <script src="index.js"></script>
    </body>

</html>
